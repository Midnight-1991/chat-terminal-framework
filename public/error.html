<!doctype html>
<html lang="zh-CN" class="page-auth-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0F4142">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Chat Terminal 页面不存在或暂时不可用。">
  <title>出了点问题 · Chat Terminal</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-auth page-error" data-design="rp">
  <div class="page-auth">
    <header class="page-top">
      <a class="page-brand" href="/">Chat Terminal</a>
      <nav class="page-nav" aria-label="页面导航">
        <a class="btn-ghost" href="/">返回对话</a>
      </nav>
    </header>

    <main class="page-main page-main-center">
      <p class="form-hint auth-eyebrow">ERROR</p>
      <h1 class="auth-title">出了点问题</h1>
      <p class="form-hint">这个页面不存在，或者暂时不可用。回到对话页通常会恢复正常。</p>

      <section class="auth-card error-card">
        <p class="legal-para">如果一直打不开，可以稍后重试，或联系发放邀请码的管理员。</p>
        <div class="error-actions">
          <a class="btn-primary" href="/">返回对话</a>
          <a class="btn-ghost" href="/account.html">去账号页</a>
        </div>
      </section>

      <p class="form-hint legal-back">
        <a class="btn-ghost" href="/privacy.html">隐私政策</a>
        <a class="btn-ghost" href="/terms.html">用户协议</a>
      </p>
    </main>

    <footer class="page-foot">
      <p class="form-hint">Chat Terminal</p>
    </footer>
  </div>
</body>
</html>
